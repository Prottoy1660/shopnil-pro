<svg width="60" height="60" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bmoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1976D2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D47A1;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="60" height="60" rx="12" fill="url(#bmoGradient)"/>
  
  <!-- BMO Text -->
  <text x="30" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">BMO</text>
  
  <!-- Bank Building Icon -->
  <rect x="15" y="32" width="30" height="20" rx="2" fill="white" opacity="0.9"/>
  <rect x="18" y="35" width="3" height="14" fill="#1976D2"/>
  <rect x="23" y="35" width="3" height="14" fill="#1976D2"/>
  <rect x="28" y="35" width="3" height="14" fill="#1976D2"/>
  <rect x="33" y="35" width="3" height="14" fill="#1976D2"/>
  <rect x="38" y="35" width="3" height="14" fill="#1976D2"/>
  
  <!-- Roof -->
  <polygon points="12,32 30,28 48,32" fill="white"/>
  
  <!-- Dollar Sign -->
  <circle cx="45" cy="18" r="8" fill="#FFC107" opacity="0.9"/>
  <text x="45" y="23" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#1976D2">$</text>
</svg>