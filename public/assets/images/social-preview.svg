<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#gradient)"/>
  
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="60" fill="rgba(255,255,255,0.1)"/>
  <circle cx="1100" cy="530" r="80" fill="rgba(255,255,255,0.08)"/>
  <circle cx="200" cy="500" r="40" fill="rgba(255,255,255,0.12)"/>
  
  <!-- Main content container -->
  <rect x="100" y="150" width="1000" height="330" rx="20" fill="rgba(255,255,255,0.95)" filter="url(#shadow)"/>
  
  <!-- Profile section -->
  <circle cx="250" cy="315" r="80" fill="#f0f0f0"/>
  <circle cx="250" cy="315" r="75" fill="url(#profileGradient)"/>
  
  <defs>
    <linearGradient id="profileGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Profile icon -->
  <path d="M250 275 C265 275 275 285 275 300 C275 315 265 325 250 325 C235 325 225 315 225 300 C225 285 235 275 250 275 Z M250 335 C280 335 290 345 290 355 L210 355 C210 345 220 335 250 335 Z" fill="white"/>
  
  <!-- Text content -->
  <text x="380" y="280" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#333">
    Shopnil Mahamud
  </text>
  
  <text x="380" y="320" font-family="Arial, sans-serif" font-size="24" fill="#666">
    UX/UI Designer & Developer
  </text>
  
  <text x="380" y="360" font-family="Arial, sans-serif" font-size="18" fill="#888">
    Creating beautiful and functional digital experiences
  </text>
  
  <!-- Decorative elements -->
  <rect x="380" y="380" width="60" height="4" rx="2" fill="#667eea"/>
  <rect x="450" y="380" width="40" height="4" rx="2" fill="#764ba2"/>
  <rect x="500" y="380" width="30" height="4" rx="2" fill="#4facfe"/>
  
  <!-- Tech stack icons -->
  <g transform="translate(750, 280)">
    <!-- React icon -->
    <circle cx="30" cy="30" r="25" fill="#61dafb" opacity="0.2"/>
    <text x="30" y="38" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#61dafb" font-weight="bold">React</text>
    
    <!-- Design icon -->
    <circle cx="100" cy="30" r="25" fill="#ff6b6b" opacity="0.2"/>
    <text x="100" y="38" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#ff6b6b" font-weight="bold">Design</text>
    
    <!-- Code icon -->
    <circle cx="170" cy="30" r="25" fill="#4ecdc4" opacity="0.2"/>
    <text x="170" y="38" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#4ecdc4" font-weight="bold">Code</text>
  </g>
  
  <!-- Website URL -->
  <text x="600" y="550" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="rgba(255,255,255,0.9)">
    Portfolio • UX/UI Design • Development
  </text>
</svg>